<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .chatbox {
            width: 100%;
            max-width: 650px;
            height: 80vh;
            min-height: 400px;
            background: #1e293b;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px #0005;
        }

        .header {
            background: #647f91;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 13px 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #647f91;
            margin-right: 20px;
        }

        .user {
            background: #2563eb;
            margin-left: 20px;
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #263449;
        }

        #userInput {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="chatbox">
        <div class="header">
            <h1> AI Chatbox</h1>
            <p>Your friendly AI assistant</p>
        </div>

        <div id="messages" aria-live="polite">
            <div class="message bot">
                Hello!  Welcome to AI Chatbox.<br>
                I'm your chat assistant. Type a message below to get started!
            </div>
        </div>

        <form class="input-area" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
                aria-label="Your message"
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");
        const messages = document.getElementById("messages");

        function addMessage(text, sender) {
            const message = document.createElement("div");
            message.className = "message " + sender;
            message.textContent = text;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        chatForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = userInput.value.trim();

            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";

            const reply = "Thanks for your message!  Your chat interface is working. To enable real AI-powered answers, we need to connect an AI service.";

            setTimeout(function() {
                addMessage(reply, "bot");
            }, 500);
        });
    </script>

</body>
</html>
