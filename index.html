<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 80vh;
            min-height: 450px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        header {
            padding: 22px;
            background: #334155;
            text-align: center;
        }

        header h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        header p {
            color: #cbd5e1;
            font-size: 13px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .bot {
            background: #334155;
            align-self: flex-start;
        }

        .user {
            background: #6366f1;
            align-self: flex-end;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #334155;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        footer {
            padding: 0 15px 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 90vh;
                min-height: 400px;
            }

            header h1 {
                font-size: 21px;
            }

            form {
                padding: 10px;
            }

            button {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="chat-container">
        <header>
            <h1>🤖 AI Chatbox</h1>
            <p>Your friendly AI assistant</p>
        </header>

        <div id="messages" aria-live="polite">
            <div class="message bot">
                Hello! 👋 Welcome to AI Chatbox.
                I'm your AI assistant. Type a message to get started!
            </div>
        </div>

        <form id="chatForm">

                type="text"
                id="userInput"
                placeholder="Ask me anything..."
                autocomplete="off"
